<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Voronoi</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="voronoi.js" defer></script>
    </head>
    <body>
        <div class="title-bar">
            <h1>Voronoi</h1>
        </div>
        <p class="description">
            A simple Voronoi diagram simulator. Press the image to reset it, or use the sliders to change the settings! <b> WARNING: SETTING THE NUMBER OF POINTS ABOVE THE DEFAULT WILL HURT PERFORMANCE.</b> It <em>will</em> look cool though.
        </p>
        <main>
            <canvas aria-label="Generated image" id="world" width="1000" height="600"></canvas>
            <button aria-label="Generate" id="generate-button" class="generate-button">Generate!</button>
            <label for="num-points">Number of points</label>
            <input type="range" min="1" max="1000" value="30" id="num-points" class="slider slider-blue">
            <label for="red-min">Minimum red</label>
            <input type="range" min="0" max="255" value="0" id="red-min" class="slider slider-red">
            <label for="red-max">Maximum red</label>
            <input type="range" min="0" max="255" value="255" id="red-max" class="slider slider-red">
            <label for="green-min">Minimum green</label>
            <input type="range" min="0" max="255" value="0" id="green-min" class="slider slider-green">
            <label for="green-max">Maximum green</label>
            <input type="range" min="0" max="255" value="255" id="green-max" class="slider slider-green">
            <label for="blue-min">Minimum blue</label>
            <input type="range" min="0" max="255" value="0" id="blue-min" class="slider slider-blue">
            <label for="blue-max">Maximum blue</label>
            <input type="range" min="0" max="255" value="255" id="blue-max" class="slider slider-blue">
        </main>
    </body>
</html>
